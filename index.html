<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4EE" />
    <meta name="description" content="MERCADIA — rival merchant dynasties reshape a canal-and-tramway city, one deliberate turn at a time. A strict turn-based dynasty civ for 1–4 players." />
    <title>MERCADIA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/client/tokens.css" />
    <link rel="stylesheet" href="/src/client/hud.css" />
    <link rel="stylesheet" href="/src/client/screens.css" />
  </head>
  <body>
    <!-- The board fills the viewport. -->
    <div id="stage"><canvas id="board" class="board-canvas" tabindex="0" aria-label="The Mercadia district. Arrow keys move the tile cursor; Enter selects."></canvas></div>
    <!-- HUD (hud.ts) mounts here. -->
    <div id="hud" hidden></div>
    <!-- Title, hotseat setup, lobby, Council card, handoff, Final Edition, confirmations (screens.ts) mount here. -->
    <div id="screens"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
