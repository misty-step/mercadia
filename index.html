<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#EFE9DC" />
    <meta name="description" content="MERCADIA — rival merchants reshape a sunlit canal-and-tramway city block by block. A real-time isometric city tycoon for 1–4 players." />
    <title>MERCADIA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div id="stage"><canvas id="city" aria-label="The Mercadia district"></canvas></div>

    <div id="hud" class="hud" hidden>
      <div class="topbar">
        <header id="clock" class="panel clock"></header>
        <div id="ticker" class="panel ticker" role="status" aria-live="polite"></div>
      </div>
      <div class="rightcol">
        <aside id="board" class="panel board" aria-label="Rival leaderboard"></aside>
        <aside id="inspector" class="panel inspector" hidden></aside>
      </div>
      <div class="leftcol">
        <div id="treasury" class="panel treasury"></div>
        <div id="ledger" class="panel ledger" hidden></div>
      </div>
      <nav id="dock" class="panel dock" aria-label="Build"></nav>
      <div id="lotcard" class="panel lotcard" hidden></div>
      <div id="speech" class="speech" hidden></div>
      <div id="banner" class="banner" aria-hidden="true"></div>
    </div>

    <section id="title" class="panel title" hidden></section>
    <section id="lobby" class="panel title lobby" hidden></section>
    <div id="victory" class="scrim" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
